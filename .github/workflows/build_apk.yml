name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Platform Harness
        working-directory: ./client
        run: |
          echo "=== 1. Backing up genuine source code and pubspec ==="
          cp -r lib /tmp/pronounce_lib_backup
          cp pubspec.yaml /tmp/pronounce_pubspec_backup.yaml

          echo "=== 2. Recreating clean Android platform scaffold ==="
          rm -rf android
          flutter create . --platforms=android --org com.pronounceai

          echo "=== 3. Restoring genuine app source and eliminating any generated templates ==="
          rm -rf lib
          cp -r /tmp/pronounce_lib_backup lib
          cp /tmp/pronounce_pubspec_backup.yaml pubspec.yaml
          rm -rf test

          echo "=== 4. Verifying lib/main.dart contents ==="
          head -n 25 lib/main.dart

          echo "=== 5. Applying Android SDK 35 & permission patches ==="
          node patch_android.js

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./client
        run: |
          echo "=== Starting Flutter Release APK Build ==="
          if flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee build_release.log; then
            echo "Release APK build succeeded!"
          else
            echo "=== Release build failed! Last 150 lines: ==="
            tail -n 150 build_release.log
            echo "=== Trying debug APK build fallback ==="
            if flutter build apk --debug --no-tree-shake-icons --verbose 2>&1 | tee build_debug.log; then
              echo "Debug APK build succeeded!"
            else
              echo "=== Debug build failed too! Last 150 lines: ==="
              tail -n 150 build_debug.log
              grep -i -E "error:|failure|fatal" build_release.log | tail -n 10 | while read -r line; do echo "::error::$line"; done || true
              exit 1
            fi
          fi

      - name: Publish Build Diagnostics
        if: always()
        working-directory: ./client
        run: |
          echo "## Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f build_release.log ]; then
            echo "### Release Build Output (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build_debug.log ]; then
            echo "### Debug Build Output (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: client/build_*.log

      - name: Verify APK Generated
        working-directory: ./client
        run: |
          echo "=== Generated APK Files ==="
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pronounce-ai-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
