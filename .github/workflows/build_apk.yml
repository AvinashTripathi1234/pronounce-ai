name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Platform Harness
        working-directory: ./client
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.pronounceai
          node patch_android.js

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./client
        run: |
          echo "=== Starting Flutter APK Build ==="
          if flutter build apk --release --no-tree-shake-icons --verbose > build_release.log 2>&1; then
            echo "Release APK build succeeded!"
          else
            echo "=== Release build failed, showing last 100 lines of log ==="
            tail -n 100 build_release.log
            echo "=== Building Debug APK fallback ==="
            if flutter build apk --debug --no-tree-shake-icons --verbose > build_debug.log 2>&1; then
              echo "Debug APK build succeeded!"
            else
              echo "=== Debug build failed too, showing last 100 lines of log ==="
              tail -n 100 build_debug.log
              exit 1
            fi
          fi

      - name: Verify APK Generated
        working-directory: ./client
        run: |
          echo "=== Generated APK Files ==="
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pronounce-ai-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
