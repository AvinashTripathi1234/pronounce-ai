name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Platform Harness
        working-directory: ./client
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.pronounceai
          
          # Patch minSdk to 21 for WebRTC compatibility using Python
          python3 -c "
          import re
          path = 'android/app/build.gradle'
          try:
              with open(path, 'r') as f:
                  content = f.read()
              content = re.sub(r'minSdkVersion = flutter\.minSdkVersion', 'minSdkVersion = 21', content)
              content = re.sub(r'minSdkVersion flutter\.minSdkVersion', 'minSdkVersion 21', content)
              content = re.sub(r'minSdk = flutter\.minSdkVersion', 'minSdk = 21', content)
              with open(path, 'w') as f:
                  f.write(content)
              print('Patched build.gradle successfully.')
          except Exception as e:
              print(f'Warning: {e}')
          "
          
          # Inject Audio & Network Permissions into AndroidManifest.xml
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              xml = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />\n'''
          if '<uses-permission' not in xml:
              xml = xml.replace('<application', perms + '    <application')
              with open(path, 'w') as f:
                  f.write(xml)
              print('Injected permissions successfully.')
          "

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: ./client
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pronounce-ai-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
